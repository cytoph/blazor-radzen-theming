name: CI

on:
  # Triggers the workflow on push events but only for tags with the "v" prefix;
  # pre-release tags (e.g. "v5.10.200-build.123" from development runs) are excluded
  push:
    tags:
      - 'v*'
      - '!v*-*'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      version:
        description: 'Version Override (optional)'
        required: false
        type: string
      tag:
        description: 'Tag to build and publish (optional, e.g. "v5.9.900"); uses this workflow instead of the one stored in the tag'
        required: false
        type: string

permissions:
  contents: read
  id-token: write # required for NuGet trusted publishing

jobs:
  build-and-publish:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5.0.0
      with:
        ref: ${{ inputs.tag || github.ref }}

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2.0.1
      with:
        nuget-version: 'latest'

    - name: Update version in nuspec
      if: ${{ github.event.inputs.version != '' }}
      uses: vers-one/dotnet-project-version-updater@v1.7
      with:
        file: "Blazor.Radzen.Theming.nuspec"
        version: ${{ github.event.inputs.version }}

    - name: Create NuGet package
      run: |
        nuget pack Blazor.Radzen.Theming.nuspec `
          -Properties "commitId=$(git rev-parse HEAD)" `
          -OutputDirectory .\packages `
          -Exclude ".git\**" `
          -Exclude ".github\**" `
          -NonInteractive

    - name: NuGet login (trusted publishing)
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: cytoph

    - name: Publish to NuGet
      run: |
        nuget push .\packages\*.nupkg `
          -Source https://api.nuget.org/v3/index.json `
          -ApiKey ${{ steps.nuget-login.outputs.NUGET_API_KEY }} `
          -SkipDuplicate `
          -NonInteractive

    - name: Upload package as artifact
      uses: actions/upload-artifact@v4.6.2
      with:
        name: nuget-package
        path: packages/*.nupkg
